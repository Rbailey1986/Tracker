name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Build Environment
        run: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphonesimulator

      - name: Build iOS App
        run: |
          xcodebuild \
            -project ios/Tracker.xcodeproj \
            -scheme Tracker \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package App Bundle
        run: |
          mkdir -p output
          APP_PATH=$(find build/Build/Products -name "Tracker.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Tracker.app not found in build products"
            find build -maxdepth 5
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" output/
          cd output && zip -r Tracker-iOS.zip Tracker.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tracker-iOS-App
          path: output/Tracker-iOS.zip
          retention-days: 14
